# TwinLedger invariant catalog (normative, TZ 12.1). Phase 1 skeleton.
# Each invariant: id, name, scope, grouping_key, metric, tolerance, exceptions.
invariants:
  - id: INV-01
    name: JE_BALANCE
    scope: journal_entry
    grouping_key: je_id
    metric: debit_minor_minus_credit_minor
    tolerance_minor: 0
    exceptions: []
