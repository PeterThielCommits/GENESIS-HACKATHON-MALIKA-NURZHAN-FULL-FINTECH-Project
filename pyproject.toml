[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twinledger"
version = "1.0.1"
description = "TwinLedger — proof-carrying audit environment for AI agents (synthetic accounting benchmark)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "jsonschema>=4"]
extras = ["gymnasium>=1", "numpy>=1.26", "scikit-learn>=1.4", "matplotlib>=3.8"]

[tool.setuptools]
packages = [
  "core", "contracts", "adapter", "gen", "gen.core", "gen.errors", "gen.distractors",
  "invariants", "verifier", "env", "harness", "scoring", "seal",
  "arena", "arena.policies", "arena.attacks", "metamorphic", "judge", "tools"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.setuptools.package-data]
contracts = ["*.json"]
