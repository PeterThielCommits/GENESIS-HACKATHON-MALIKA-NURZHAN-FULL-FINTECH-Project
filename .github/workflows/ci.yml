name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup check (Python 3.11, no downloads)
        run: make setup
      - name: Lint + import boundaries
        run: make lint
      - name: Core tests
        run: make test
      - name: Property tests (stdlib fallback)
        run: make test-property
      - name: Full verification + Judge Kit reports
        run: make verify && make report
      - name: Upload verify artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-reports
          path: artifacts/reports/latest/
          if-no-files-found: warn

  docker-offline:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - name: Build and run hardened offline container (--network=none, read-only rootfs, cap-drop ALL)
        run: |
          set -o pipefail
          make docker-check 2>&1 | tee docker-check.log
      - name: Upload offline container log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-check-log
          path: docker-check.log
          if-no-files-found: warn
