name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup check (Python 3.11, no downloads)
        run: make setup
      - name: Lint + import boundaries
        run: make lint
      - name: Core tests
        run: make test
      - name: Property tests (stdlib fallback)
        run: make test-property
      - name: Full verification + Judge Kit reports
        run: make verify && make report
      - name: Release candidate audit (TZ 16.5/16.6)
        run: make release-audit
      - name: Evidence freeze (Phase 17 - the committed archive must match the tree)
        run: make evidence-verify
      - name: Upload verify artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-reports
          path: artifacts/reports/latest/
          if-no-files-found: warn

  base-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the pinned base image digest and report upstream drift
        run: python3 tools/docker_build_info.py resolve --report-status

  docker-offline:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - name: Build the offline image
        run: |
          set -o pipefail
          make docker-build 2>&1 | tee docker-build.log
      - name: Run hardened offline container (--network=none, read-only rootfs, cap-drop ALL)
        run: |
          set -o pipefail
          make docker-check-container 2>&1 | tee docker-check.log
      - name: Publish the image build provenance (base digest, Python patch version, package versions)
        if: always()
        run: python3 tools/docker_build_info.py publish || true
      - name: Surface offline container failure in annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          path = "docker-check.log"
          if not os.path.exists(path):
              print("::error::docker-check.log missing - the step failed before producing output")
              raise SystemExit(0)
          lines = [l.rstrip() for l in open(path, encoding="utf-8", errors="replace") if l.strip()]
          keys = ("FAIL", "Error", "error", "Traceback", "Permission", "Exception", "No such file", "verify:", "DRIFT", "STALE", "line ")
          tail = [l for l in lines if any(k in l for k in keys)][-10:] or lines[-8:]
          for line in tail:
              print("::error::" + line[:900])
          PY
      - name: Container-equivalent local run (informational, needs unprivileged user namespaces)
        if: always()
        continue-on-error: true
        run: python3 tools/container_local_check.py --out container-local-check.json
      - name: Upload offline container log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-check-log
          path: |
            docker-build.log
            docker-check.log
            container-local-check.json
          if-no-files-found: warn
