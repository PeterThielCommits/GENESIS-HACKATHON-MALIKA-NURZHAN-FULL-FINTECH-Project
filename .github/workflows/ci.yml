name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup check (Python 3.11, no downloads)
        run: make setup
      - name: Lint + import boundaries
        run: make lint
      - name: Core tests
        run: make test
      - name: Property tests (stdlib fallback)
        run: make test-property
      - name: Full verification + Judge Kit reports
        run: make verify && make report
      - name: Release candidate audit (TZ 16.5/16.6)
        run: make release-audit
      - name: Evidence freeze (Phase 17 - the committed archive must match the tree)
        run: make evidence-verify
      - name: Upload verify artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-reports
          path: artifacts/reports/latest/
          if-no-files-found: warn

  base-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the pinned base image digest and report upstream drift
        run: python3 tools/docker_build_info.py resolve --report-status

  docker-offline:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - name: Build the offline image
        run: |
          set -o pipefail
          make docker-build 2>&1 | tee docker-build.log
      - name: Run hardened offline container (--network=none, read-only rootfs, cap-drop ALL)
        run: |
          set -o pipefail
          make docker-check-container 2>&1 | tee docker-check.log
      - name: Publish the image build provenance (base digest, Python patch version, package versions)
        if: always()
        run: python3 tools/docker_build_info.py publish
      - name: Surface offline container failure in annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          path = "docker-check.log"
          if not os.path.exists(path):
              print("::error::docker-check.log missing - the step failed before producing output")
              raise SystemExit(0)
          lines = [l.rstrip() for l in open(path, encoding="utf-8", errors="replace") if l.strip()]
          keys = ("FAIL", "Error", "error", "Traceback", "Permission", "Exception", "No such file", "verify:", "DRIFT", "STALE", "line ")
          tail = [l for l in lines if any(k in l for k in keys)][-10:] or lines[-8:]
          for line in tail:
              print("::error::" + line[:900])
          PY
      - name: Enable unprivileged user namespaces for the container-equivalent run
        id: userns
        if: always()
        run: |
          if sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>&1; then
            echo "unprivileged user namespaces: enabled on this runner"
            echo "enabled=true" >> "${GITHUB_OUTPUT:-/dev/null}"
          else
            echo "unprivileged user namespaces: NOT enabled on this runner (the AppArmor restriction stays in place)"
            echo "enabled=false" >> "${GITHUB_OUTPUT:-/dev/null}"
          fi
      - name: Container-equivalent local run (namespace-equivalent hardening)
        if: always()
        run: |
          set +e
          python3 tools/container_local_check.py --out container-local-check.json 2>&1 | tee container-local-check.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "container-local-check: PASS"
            echo "container-local-check: PASS (the namespace-equivalent run completed)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          elif [ "$rc" -eq 2 ]; then
            echo "::notice title=Container-equivalent check SKIPPED::This runner does not permit unprivileged user namespaces, so the namespace-equivalent validation was SKIPPED, not passed. The authoritative image validation is the docker-offline job."
            echo "container-local-check: SKIPPED (this runner cannot provide unprivileged user namespaces)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            echo "::error title=Container-equivalent check FAILED::The namespace-equivalent run failed with exit code $rc. See container-local-check.log and the uploaded artifact."
            echo "container-local-check: FAILED (exit $rc)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit "$rc"
          fi
      - name: Upload offline container log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-check-log
          path: |
            docker-build.log
            docker-check.log
            container-local-check.log
            container-local-check.json
          if-no-files-found: warn
